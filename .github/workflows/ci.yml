name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs for the same branch/PR so rapid pushes don't pile up
# (caps usage if the repo is ever private or on paid runners).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit SHA (not a moving tag) so a
# compromised or retagged action can't silently change what runs in CI.
# Dependabot (github-actions ecosystem) proposes SHA bumps.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Full cross-platform matrix on pushes to main; Linux-only on PRs to keep
      # them fast and cheap (macOS bills at 10x, Windows 2x, if ever private).
      # main is the merge target, so every change still gets full coverage there.
      matrix:
        os: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (host + plugins)
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  otel:
    name: contrib/otel (nested module)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            contrib/otel/go.sum
      - name: Build (static, no cgo)
        working-directory: contrib/otel
        run: CGO_ENABLED=0 go build ./...
      - name: Vet
        working-directory: contrib/otel
        run: go vet ./...
      - name: Test
        working-directory: contrib/otel
        run: go test -race ./...
      - name: go.mod is tidy
        working-directory: contrib/otel
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: govulncheck
        working-directory: contrib/otel
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  perf:
    name: perf budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Instrumentation latency and allocation budget
        run: CONSOLE_PERF=1 go test ./internal/flags -run Instrumentation -v
      - name: Binary size and no-OTel check
        run: scripts/check-binary-size.sh
      - name: Observability assets (dashboard, alerts, metric names)
        run: scripts/check-observability.sh
      - name: Auth docs and packaging guard
        run: scripts/check-auth-docs.sh

  lint:
    name: gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal contrib)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          # The tool may need a newer Go than our floor; let only the install
          # fetch it. The scan itself runs against the pinned floor toolchain.
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
